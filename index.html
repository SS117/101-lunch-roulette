<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#67a9d4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="午餐 Roulette">
  <title>101 午餐 Roulette</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">TAIPEI 101 LUNCH</p>
        <h1>今天吃什麼？</h1>
        <p id="todayText" class="sub"></p>
      </div>
      <button id="themeBtn" class="icon-btn" aria-label="切換深色模式">◐</button>
    </header>

    <section class="summary-grid">
      <article class="stat">
        <span>本週已吃</span>
        <strong id="weekCount">0 / 4</strong>
      </article>
      <article class="stat">
        <span>&gt; NT$200</span>
        <strong id="expensiveUsed">尚未使用</strong>
      </article>
      <article class="stat">
        <span>本週平均</span>
        <strong id="weekAvg">—</strong>
      </article>
    </section>

    <section class="card roulette-card">
      <div class="card-head">
        <div>
          <p class="eyebrow">ROULETTE</p>
          <h2>午餐抽籤</h2>
        </div>
        <select id="modeSelect" class="select">
          <option value="normal">正常模式</option>
          <option value="save">省錢模式 ≤180</option>
          <option value="random">完全隨機</option>
        </select>
      </div>

      <div class="filters">
        <label class="chip"><input type="checkbox" id="excludeKorean"> 排除韓式</label>
        <label class="chip"><input type="checkbox" id="excludeConvenience"> 排除超商</label>
      </div>

      <div id="resultBox" class="result-box">
        <div class="result-placeholder">按下按鈕，交給命運決定。</div>
      </div>

      <div class="actions">
        <button id="drawBtn" class="primary">🎲 抽今天午餐</button>
        <button id="redrawBtn" class="secondary" disabled>重抽一次</button>
      </div>

      <div id="confirmPanel" class="confirm-panel hidden">
        <label>實際花費
          <div class="money-input"><span>NT$</span><input id="actualPrice" type="number" min="0" step="1" inputmode="numeric"></div>
        </label>
        <button id="acceptBtn" class="success">✓ 就吃這間</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <p class="eyebrow">THIS WEEK</p>
          <h2>本週紀錄</h2>
        </div>
        <button id="resetWeekBtn" class="text-btn danger">重置本週</button>
      </div>
      <div id="weekHistory" class="history"></div>

      <details class="manual-add">
        <summary>＋手動新增週一～週四紀錄</summary>
        <div class="manual-grid">
          <select id="manualDay">
            <option value="1">週一</option>
            <option value="2">週二</option>
            <option value="3">週三</option>
            <option value="4">週四</option>
          </select>
          <select id="manualShop"></select>
          <input id="manualPrice" type="number" min="0" step="1" inputmode="numeric" placeholder="實際金額">
          <button id="manualAddBtn" class="secondary">新增紀錄</button>
        </div>
        <p class="hint" style="margin-top:8px">該天已有紀錄時，可選擇覆蓋原紀錄。</p>
      </details>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <p class="eyebrow">RESTAURANTS</p>
          <h2>店家池</h2>
        </div>
      </div>
      <div id="shopList" class="shop-list"></div>
      <details class="add-shop">
        <summary>＋新增店家</summary>
        <div class="form-grid">
          <input id="newName" placeholder="店名">
          <input id="newPrice" type="number" placeholder="預估價格">
          <select id="newCategory">
            <option value="台式">台式</option>
            <option value="港式">港式</option>
            <option value="韓式">韓式</option>
            <option value="印度">印度</option>
            <option value="超市">超市</option>
            <option value="超商">超商</option>
            <option value="其他">其他</option>
          </select>
          <button id="addShopBtn" class="secondary">加入</button>
        </div>
      </details>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <p class="eyebrow">DATA</p>
          <h2>資料</h2>
        </div>
      </div>
      <div class="actions compact">
        <button id="exportBtn" class="secondary">匯出 CSV</button>
        <button id="clearAllBtn" class="text-btn danger">清除全部紀錄</button>
      </div>
      <p class="hint">所有資料只存在此裝置瀏覽器的 LocalStorage，不會上傳網路。</p>
    </section>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
